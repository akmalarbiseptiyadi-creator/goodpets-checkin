<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Event Check-In</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #ffffff;
    }

    h2 {
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #result {
      margin: 20px auto;
      padding: 15px;
      max-width: 500px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
    }

    input {
      padding: 12px;
      width: 90%;
      max-width: 400px;
      margin-bottom: 15px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>Event Check-In</h2>

  <input
    type="text"
    id="staffName"
    placeholder="Masukkan nama petugas"
  >

  <div id="reader"></div>

  <div id="result">
    Silakan scan QR peserta
  </div>

  <script>

    /*
     * URL WEB APP GOOGLE APPS SCRIPT
     * yang sudah kamu buat sebelumnya.
     */
    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbz3u9rtixQ-a3uoUgtbtpS_Dk-SyiDzYr2eYyIehaX8fXkDNSX7SUlr3pEzhPGPvk-x/exec";


    let sudahScan = false;


    function tampilkanHasil(pesan) {
      document.getElementById("result").innerHTML = pesan;
    }


    async function kirimCheckIn(registrationID, staffName) {

      /*
       * Kirim data ke Google Apps Script.
       *
       * Kita menggunakan POST supaya scanner
       * yang di-host di GitHub Pages dapat
       * berkomunikasi dengan Apps Script.
       */

      try {

        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "checkIn",
            registrationID: registrationID,
            staffName: staffName
          })
        });

        const text = await response.text();

        return text;

      } catch (error) {

        throw new Error(
          "Gagal terhubung ke server: " + error.message
        );

      }
    }


    async function onScanSuccess(decodedText, decodedResult) {

      // Mencegah scanner membaca QR berkali-kali
      if (sudahScan) return;

      sudahScan = true;


      const registrationID = decodedText.trim();

      const staffName =
        document.getElementById("staffName").value.trim();


      // Cek nama petugas
      if (!staffName) {

        tampilkanHasil(
          "⚠️ Masukkan nama petugas terlebih dahulu."
        );

        sudahScan = false;

        return;
      }


      tampilkanHasil(
        "⏳ Memproses check-in..."
      );


      try {

        const response = await kirimCheckIn(
          registrationID,
          staffName
        );


        tampilkanHasil(response);


        // Beri jeda 2 detik sebelum scan berikutnya
        setTimeout(function() {

          sudahScan = false;

        }, 2000);


      } catch (error) {

        tampilkanHasil(
          "❌ " + error.message
        );

        sudahScan = false;

      }

    }


    function onScanFailure(error) {
      // Tidak perlu menampilkan error.
      // Scanner akan terus mencoba membaca QR.
    }


    const html5QrcodeScanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },
        false
      );


    html5QrcodeScanner.render(
      onScanSuccess,
      onScanFailure
    );

  </script>

</body>
</html>
