<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GoodPets Event Check-In</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px 18px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
    }

    .header p {
      color: #777;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
    }

    .staff-box {
      margin-top: 20px;
    }

    .staff-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .staff-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .success {
      display: block;
      background: #e8f7ed;
      color: #16833b;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #c62828;
    }

    .warning {
      display: block;
      background: #fff5dc;
      color: #9a6700;
    }

    .participant {
      text-align: center;
      margin-top: 18px;
    }

    .participant-name {
      font-size: 23px;
      font-weight: bold;
    }

    .participant-id {
      margin-top: 6px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>GoodPets Event</h1>
    <p>QR Code Check-In</p>
  </div>

  <div class="card">

    <div id="reader"></div>

    <div class="staff-box">

      <label>Nama Staff</label>

      <input
        type="text"
        id="staffName"
        placeholder="Masukkan nama staff">

    </div>

    <div id="status" class="status"></div>

    <div id="participant" class="participant"></div>

  </div>

</div>


<script>

const GOOGLE_APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzcVD2_ZtREdxRLki9yu72JScBuFXB030R35GTSm_PbCPRuKeWslGHIhm7rxr0piFkJ/exec";

let processing = false;


function showStatus(message, type) {

  const status =
    document.getElementById("status");

  status.innerText = message;

  status.className =
    "status " + type;
}


function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  const registrationID =
    decodedText.trim();

  const staffName =
    document
      .getElementById("staffName")
      .value
      .trim();


  if (!staffName) {

    showStatus(
      "Masukkan nama staff terlebih dahulu.",
      "warning"
    );

    processing = false;

    return;
  }


  showStatus(
    "Memproses check-in...",
    "warning"
  );


  fetch(GOOGLE_APPS_SCRIPT_URL, {

    method: "POST",

    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },

    body: JSON.stringify({

      action: "checkIn",

      registrationID:
        registrationID,

      staffName:
        staffName

    })

  })

  .then(response => response.json())

  .then(result => {

    if (result.success) {

      showStatus(
        "✓ " + result.message,
        "success"
      );

      document.getElementById(
        "participant"
      ).innerHTML =

        '<div class="participant-name">' +
        (result.name || "Peserta") +
        '</div>' +

        '<div class="participant-id">' +
        registrationID +
        '</div>';

    }

    else if (result.alreadyCheckedIn) {

      showStatus(
        "⚠ Peserta sudah check-in.",
        "error"
      );

    }

    else {

      showStatus(
        result.message ||
        "Registration ID tidak ditemukan.",
        "error"
      );

    }

  })

  .catch(error => {

    console.error(error);

    showStatus(
      "Gagal terhubung ke sistem check-in.",
      "error"
    );

  })

  .finally(() => {

    setTimeout(() => {
      processing = false;
    }, 2000);

  });

}


function startScanner() {

  const scanner =
    new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess

  )

  .catch(error => {

    console.error(error);

    showStatus(
      "Kamera tidak dapat dibuka. Izinkan akses kamera.",
      "error"
    );

  });

}


window.onload = function() {

  startScanner();

};

</script>

</body>
</html>
